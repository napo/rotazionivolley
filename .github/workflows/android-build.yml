name: Android build

# Builds the Android app and attaches the APK to the GitHub Release. Runs on
# every published release, plus manual dispatch for testing. Builds a
# release-signed APK when the release-signing secrets (ANDROID_KEYSTORE_*)
# are configured on the repo; otherwise falls back to a debug-signed build
# (installable on a device for testing, but not suitable for distribution).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default packages include the legacy "tools" package, which no
          # longer exists in the SDK repository and makes the action fail.
          # platform-tools is all this action needs to provide up front —
          # the Gradle build downloads whatever platform/build-tools it
          # needs itself (licenses are already accepted by this action).
          packages: platform-tools

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build --workspace web

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Check for release signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.has_keystore == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        if: steps.signing.outputs.has_keystore == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK
        if: steps.signing.outputs.has_keystore == 'false'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Gradle's fixed "app-release.apk" says nothing about the app or its
      # version, so name the file like the desktop installers.
      - name: Rename APK
        run: |
          version=$(node -p "require('./web/package.json').version")
          mkdir -p dist
          for apk in android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/debug/app-debug.apk; do
            if [ -f "$apk" ]; then
              suffix=""
              case "$apk" in *debug*) suffix="-debug" ;; esac
              cp "$apk" "dist/Rotazioni Volley-${version}${suffix}.apk"
            fi
          done

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rotazionivolley-android-${{ steps.signing.outputs.has_keystore == 'true' && 'release' || 'debug' }}
          path: dist/*.apk
          if-no-files-found: ignore

      - name: Attach APK to the GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
