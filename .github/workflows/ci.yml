name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check versions are aligned
        # Every copy of the version must match package.json (and, on a
        # release, the release tag) — see scripts/sync-version.mjs.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/sync-version.mjs --check ${RELEASE_TAG:+--tag "$RELEASE_TAG"}

      - name: Typecheck + build
        run: npm run build --workspace web

      - name: Unit tests
        run: npm run test --workspace web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: End-to-end tests
        run: npm run test:e2e --workspace web

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
